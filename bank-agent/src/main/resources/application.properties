spring.application.name=bank-agent
server.port=8085

# LLM : Groq (API compatible OpenAI). La cle vient d'une variable d'environnement (jamais commitee)
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=${LLM_BASE_URL:https://api.groq.com/openai}
spring.ai.openai.chat.options.model=${LLM_MODEL:openai/gpt-oss-120b}
spring.ai.openai.chat.options.temperature=0.2
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

# MCP Client : connexion aux serveurs MCP des microservices (SSE)
spring.ai.mcp.client.name=bank-agent-mcp-client
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.request-timeout=30s
spring.ai.mcp.client.sse.connections.account-service.url=${ACCOUNT_MCP_URL:http://localhost:8081}
spring.ai.mcp.client.sse.connections.transaction-service.url=${TRANSACTION_MCP_URL:http://localhost:8082}

# Eureka
eureka.client.service-url.defaultZone=${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info