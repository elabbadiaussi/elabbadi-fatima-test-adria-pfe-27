spring.application.name=transaction-service
server.port=8082

# Config Server (bank.transaction.max-amount viendra de config-service, defaut = 1000)
spring.config.import=optional:configserver:${CONFIG_SERVICE_URL:http://localhost:9999}

# Base H2
spring.datasource.url=jdbc:h2:mem:transactions-db
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update

# Eureka
eureka.client.service-url.defaultZone=${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# OpenFeign : URL directe tant qu'Eureka n'est pas en place (vide = decouverte via Eureka)
account-service.url=${ACCOUNT_SERVICE_URL:http://localhost:8081}
spring.cloud.openfeign.circuitbreaker.enabled=true

# Kafka (producteur)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.max.block.ms=5000
bank.kafka.topic.transactions-created=bank.transactions.created

# Actuator
management.endpoints.web.exposure.include=health,info,circuitbreakers
management.health.circuitbreakers.enabled=true

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html

# GraphQL
spring.graphql.graphiql.enabled=true

# MCP Server
spring.ai.mcp.server.name=transaction-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC